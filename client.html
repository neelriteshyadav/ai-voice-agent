<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LiveKit + Pipecat Client (auto latency logger)</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
  <style>
    :root { color-scheme: dark light; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    button { margin: 0 8px 8px 0; padding: 10px 14px; border: 1px solid #9993; border-radius: 10px; cursor: pointer; }
    #status { margin: 12px 0; }
    #logs { background: #111; color: #0f0; padding: 12px; white-space: pre-wrap; border-radius: 8px; max-height: 240px; overflow: auto; }
    .row { margin: 12px 0; }
    .pill { padding: 2px 8px; border-radius: 999px; border: 1px solid #9994; font-size: 12px; }
    #latencyLog { margin-left: 8px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; display:inline-block; min-width: 420px;}
  </style>
</head>
<body>
  <h1>LiveKit media + Pipecat agent</h1>

  <div class="row">
    <button id="connectBtn">Connect</button>
    <button id="disconnectBtn" disabled>Disconnect</button>
    <button id="enableAudioBtn" disabled>Enable Audio</button>
    <button id="muteBtn" disabled>Mute</button>
    <span id="status" class="pill">disconnected</span>
  </div>

  <div class="row">
    <strong>Latency:</strong> <span id="latencyLog">auto: 0 samples — avg N/A</span>
  </div>

  <h3>Logs</h3>
  <div id="logs"></div>

  <!-- Agent audio -->
  <audio id="remoteAudio" autoplay playsinline></audio>

  <!-- IMPORTANT: load the probe BEFORE inline code that uses it -->
  <script src="latency_probe.js"></script>

  <script>
    const { Room, RoomEvent, createLocalAudioTrack } = LivekitClient;

    const $ = (sel) => document.querySelector(sel);
    const logEl = $('#logs'), statusEl = $('#status');
    function log(...args) {
      const line = args.map(a => (typeof a === 'string' ? a : JSON.stringify(a))).join(' ');
      const t = new Date().toISOString().split('T')[1].replace('Z','');
      logEl.textContent += `[${t}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(...args);
    }
    function setStatus(s) { statusEl.textContent = s; }

    let room = null;
    let localAudioTrack = null;
    let isMuted = false;
    const remoteAudio = $('#remoteAudio');
    let autoLogger = null;

    async function getTokenFromServer(roomName = 'demo-room') {
      const id = 'user-' + Math.random().toString(36).slice(2, 8);
      const res = await fetch(`http://127.0.0.1:8787/token?room=${encodeURIComponent(roomName)}&identity=${encodeURIComponent(id)}`);
      if (!res.ok) {
        let detail = '';
        try { const j = await res.json(); detail = j.error || JSON.stringify(j); } catch {}
        throw new Error(`token server error ${res.status}: ${detail}`);
      }
      return res.json();
    }

    async function connect() {
      if (room) return;
      const { url, token } = await getTokenFromServer();
      log('🔑 got token');

      room = new Room({
        adaptiveStream: true,
        dynacast: true,
        audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });

      room
        .on(RoomEvent.ParticipantConnected, p => log('👥 participant joined:', p.identity))
        .on(RoomEvent.ParticipantDisconnected, p => log('👋 participant left:', p?.identity))
        .on(RoomEvent.TrackSubscribed, (track, publication, participant) => {
          log('🎧 TrackSubscribed', track.kind, 'from', participant.identity);
          if (track.kind === 'audio') {
            const tmp = track.attach();
            remoteAudio.srcObject = tmp.srcObject;

            // Start auto logger once both local+remote are ready
            maybeStartAutoLogger();
          }
        })
        .on(RoomEvent.TrackUnsubscribed, (track, publication, participant) => {
          log('➖ TrackUnsubscribed', track.kind, 'from', participant.identity);
        })
        .on(RoomEvent.ConnectionStateChanged, state => {
          log('🔌 connection state:', state);
          setStatus(state);
        })
        .on(RoomEvent.AudioPlaybackStatusChanged, () => {
          log('🔈 canPlaybackAudio=', room.canPlaybackAudio);
          $('#enableAudioBtn').disabled = room.canPlaybackAudio;
        });

      await room.connect(url, token);
      setStatus('connected');
      $('#disconnectBtn').disabled = true; // until mic is up

      // publish microphone
      localAudioTrack = await createLocalAudioTrack();
      await room.localParticipant.publishTrack(localAudioTrack);
      log('🎙️ mic published');
      $('#disconnectBtn').disabled = false;
      $('#enableAudioBtn').disabled = room.canPlaybackAudio;
      $('#muteBtn').disabled = false;

      // If remote already present, arm logger
      maybeStartAutoLogger();
    }

    function maybeStartAutoLogger() {
      if (autoLogger) return;
      if (!localAudioTrack) return;
      if (!remoteAudio.srcObject) return;

      // sanity check export
      if (!window.LatencyProbe || typeof window.LatencyProbe.autoAttach !== 'function') {
        console.error('LatencyProbe export missing or wrong:', window.LatencyProbe);
        return;
      }

      try {
        autoLogger = window.LatencyProbe.autoAttach({
          room,
          localTrack: localAudioTrack,
          remoteAudioEl: remoteAudio,
          logSelector: '#latencyLog',
        });
        log('⏱️ Auto latency logger armed');
      } catch (e) {
        log('⚠️ Could not start auto latency logger:', e.message);
      }
    }

    async function disconnect() {
      if (!room) return;
      try {
        if (localAudioTrack) {
          await room.localParticipant.unpublishTrack(localAudioTrack);
          localAudioTrack.stop();
          localAudioTrack = null;
        }
        if (autoLogger) { autoLogger.stop(); autoLogger = null; }
        await room.disconnect();
      } finally {
        room = null;
        setStatus('disconnected');
        $('#disconnectBtn').disabled = true;
        $('#enableAudioBtn').disabled = true;
        $('#muteBtn').disabled = true;
        remoteAudio.srcObject = null;
        log('🔌 disconnected');
        $('#latencyLog').textContent = 'auto: 0 samples — avg N/A';
      }
    }

    async function enableAudio() {
      if (!room) return;
      await room.startAudio();
      $('#enableAudioBtn').disabled = room.canPlaybackAudio;
      log('🔊 audio started');
    }

    async function toggleMute() {
      if (!room || !localAudioTrack) return;
      isMuted = !isMuted;
      await room.localParticipant.setMicrophoneEnabled(!isMuted);
      $('#muteBtn').textContent = isMuted ? 'Unmute' : 'Mute';
      log(isMuted ? '🔇 mic muted' : '🎙️ mic unmuted');
    }

    // UI
    $('#connectBtn').addEventListener('click', async () => {
      $('#connectBtn').disabled = true;
      try { await connect(); }
      catch (e) { log('❌ connect error', e); $('#connectBtn').disabled = false; }
    });
    $('#disconnectBtn').addEventListener('click', disconnect);
    $('#enableAudioBtn').addEventListener('click', enableAudio);
    $('#muteBtn').addEventListener('click', toggleMute);
  </script>
</body>
</html>
